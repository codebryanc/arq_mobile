name: arq_mobile
description: "The Movie DB - Flutter Technical Challenge"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.4

  # Formatting
  intl: ^0.20.2

  # Networking
  dio: ^5.7.0

  # Native splash screen
  flutter_native_splash: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/splash/portrait.png
  android: true
  ios: true
  web: false

  color_dark: "#000000"
  image_dark: assets/splash/portrait_only_logo.png

  android_12:
    image: assets/splash/android12.png
    color: "#ffffff"
    icon_background_color: "#ffffff"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/splash/
